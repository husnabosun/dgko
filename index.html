<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi ki doğdun Selen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: "Times New Roman", Times, serif;
  }

  /* ===== BAŞLANGIÇ EKRANI ===== */
  #startScreen {
    position: fixed;
    inset: 0;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    cursor: pointer;
  }

  #startScreen h2 {
    font-family: "Times New Roman", Times, serif;
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    color: #000;
    border: 4px solid #000;
    padding: 24px 40px;
    animation: startPulse 1.4s ease-in-out infinite;
  }

  @keyframes startPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  #startScreen.hidden {
    display: none;
  }

  /* ===== ANA SAHNE (başta gizli) ===== */
  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: none;
  }

  .stage.visible {
    display: block;
  }

  .item {
    position: absolute;
    top: -160px;
    animation-name: fallSpin;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform;
  }

  .item img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 6px;
    border: 3px solid #333;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.35);
  }

  /* fotoğraf yoksa yerine düşen kare placeholder */
  .placeholder {
    width: 90px;
    height: 90px;
    border-radius: 6px;
    border: 3px solid #333;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.35);
  }

  @keyframes fallSpin {
    0%   { transform: translateY(0) rotate(0deg) scale(1); }
    50%  { transform: translateY(55vh) rotate(360deg) scale(1.3); }
    100% { transform: translateY(115vh) rotate(720deg) scale(1); }
  }

  .center-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(92vw, 900px);
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }

  .center-text h1 {
    font-family: "Times New Roman", Times, serif;
    font-weight: bold;
    font-size: clamp(2.2rem, 9vw, 6rem);
    color: #c3f705;
    letter-spacing: 2px;
    display: inline-block;
  }

  /* Yalnızca stage görünür olduğunda animasyon başlasın */
  .stage.visible .center-text h1 {
    animation:
      ppEntrance 1.1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards,
      ppSpin 3s ease-in-out 1.1s infinite;
  }

  @keyframes ppEntrance {
    0%   { transform: rotate(0deg) scale(0.1); opacity: 0; }
    80%  { transform: rotate(1440deg) scale(1.2); opacity: 1; }
    100% { transform: rotate(1440deg) scale(1); opacity: 1; }
  }

  /* Eski usül PowerPoint "WordArt döndürme" hissi */
  @keyframes ppSpin {
    0%   { transform: rotate(0deg) scale(1); }
    10%  { transform: rotate(-8deg) scale(1.05); }
    20%  { transform: rotate(6deg) scale(0.95); }
    30%  { transform: rotate(-4deg) scale(1.1); }
    40%  { transform: rotate(0deg) scale(1); }
    55%  { transform: rotateY(180deg) scale(1); }
    70%  { transform: rotateY(360deg) scale(1); }
    85%  { transform: rotate(3deg) scale(1.08); }
    100% { transform: rotate(0deg) scale(1); }
  }
</style>
</head>
<body>

<div id="startScreen">
  <h2>BURAYA TIKLA</h2>
</div>

<div class="stage" id="stage">
  <div class="center-text">
    <h1>İYİ Kİ DOĞDUN SELEN</h1>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="muzik.mp3" type="audio/mpeg">
</audio>

<script>
const startScreen = document.getElementById('startScreen');
const stage = document.getElementById('stage');

startScreen.addEventListener('click', () => {
  // Başlangıç ekranını kaldır
  startScreen.classList.add('hidden');

  // Müziği başlat (YouTube embed, otomatik oynat + tekrar tekrar çalsın)
  const music = document.getElementById('bgMusic');
  music.play().catch(() => {
    console.log("Müzik çalınamadı. Tarayıcı otomatik oynatmayı engelliyor olabilir.");
  });

  // Sahneyi görünür yap (bu, tüm animasyonları da tetikler)
  stage.classList.add('visible');

  // ============================================
  // FOTOĞRAFLARINI BURAYA EKLE:
  // dosyaları index.html ile aynı klasöre koy,
  // isimlerini aşağıya yaz. Boş bırakırsan
  // yerine sade kareler düşer.
  // ============================================
  const photos = [
    "bir.JPEG",
    "iki.JPEG",
    "uc.JPEG",
    "dort.JPEG",
  ];

  const placeholderColors = ["#e74c3c","#3498db","#2ecc71","#f1c40f","#9b59b6","#e67e22"];

  const totalItems = 20;

  for (let i = 0; i < totalItems; i++) {
    const item = document.createElement('div');
    item.className = 'item';

    if (photos.length > 0) {
      const img = document.createElement('img');
      img.src = photos[i % photos.length];
      item.appendChild(img);
    } else {
      const box = document.createElement('div');
      box.className = 'placeholder';
      box.style.background = placeholderColors[i % placeholderColors.length];
      item.appendChild(box);
    }

    const left = Math.random() * 100;
    const duration = 6 + Math.random() * 6;
    const delay = Math.random() * 8;

    item.style.left = left + 'vw';
    item.style.animationDuration = duration + 's';
    item.style.animationDelay = delay + 's';

    stage.appendChild(item);
  }
}, { once: true });
</script>

</body>
</html>
